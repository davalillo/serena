# the name by which the project can be referenced within Serena
project_name: "serena"


# list of languages for which language servers are started; choose from:
#   al                  bash                clojure             cpp                 csharp
#   csharp_omnisharp    dart                elixir              elm                 erlang
#   fortran             fsharp              go                  groovy              haskell
#   java                julia               kotlin              lua                 markdown
#   matlab              nix                 pascal              perl                php
#   php_phpactor        powershell          python              python_jedi         r
#   rego                ruby                ruby_solargraph     rust                scala
#   swift               terraform           toml                typescript          typescript_vts
#   vue                 yaml                zig
#   (This list may be outdated. For the current list, see values of Language enum here:
#   https://github.com/oraios/serena/blob/main/src/solidlsp/ls_config.py
#   For some languages, there are alternative language servers, e.g. csharp_omnisharp, ruby_solargraph.)
# Note:
#   - For C, use cpp
#   - For JavaScript, use typescript
#   - For Free Pascal/Lazarus, use pascal
# Special requirements:
#   Some languages require additional setup/installations.
#   See here for details: https://oraios.github.io/serena/01-about/020_programming-languages.html#language-servers
# When using multiple languages, the first language server that supports a given file will be used for that file.
# The first language is the default language and the respective language server will be used as a fallback.
# Note that when using the JetBrains backend, language servers are not used and this list is correspondingly ignored.
languages:
- python
- markdown
- yaml
- typescript

# the encoding used by text files in the project
# For a list of possible encodings, see https://docs.python.org/3.11/library/codecs.html#standard-encodings
encoding: "utf-8"

# whether to use the project's gitignore file to ignore files
# Added on 2025-04-07
ignore_all_files_in_gitignore: true

# list of additional paths to ignore
# same syntax as gitignore, so you can use * and **
# Was previously called `ignored_dirs`, please update your config if you are using that.
# Added (renamed)on 2025-04-07
ignored_paths:
  - ".claude/**/*"
  - ".git/**/*"
  - ".serena/**/*"
  - "*.log"
  - "*.tmp"

# whether the project is in read-only mode
# If set to true, all editing tools will be disabled and attempts to use them will result in an error
# Added on 2025-04-18
read_only: false

# list of tool names to exclude.
# This extends the existing exclusions (e.g. from the global configuration)
#
# Below is the complete list of tools for convenience.
# To make sure you have the latest list of tools, and to view their descriptions, 
# execute `uv run scripts/print_tool_overview.py`.
#  * `activate_project`: Activates a project based on the project name or path.
#  * `check_onboarding_performed`: Checks whether project onboarding was already performed.
#  * `create_text_file`: Creates/overwrites a file in the project directory.
#  * `delete_memory`: Delete a memory file. Should only happen if a user asks for it explicitly,
#       for example by saying that the information retrieved from a memory file is no longer correct
#       or no longer relevant for the project.
#  * `edit_memory`: Replaces content matching a regular expression in a memory.
#  * `execute_shell_command`: Executes a shell command.
#  * `find_file`: Finds files in the given relative paths
#  * `find_referencing_symbols`: Finds symbols that reference the given symbol using the language server backend
#  * `find_symbol`: Performs a global (or local) search using the language server backend.
#  * `get_current_config`: Prints the current configuration of the agent, including the active and available projects, tools, contexts, and modes.
#  * `get_symbols_overview`: Gets an overview of the top-level symbols defined in a given file.
#  * `initial_instructions`: Provides instructions Serena usage (i.e. the 'Serena Instructions Manual')
#       for clients that do not read the initial instructions when the MCP server is connected.
#  * `insert_after_symbol`: Inserts content after the end of the definition of a given symbol.
#  * `insert_before_symbol`: Inserts content before the beginning of the definition of a given symbol.
#  * `list_dir`: Lists files and directories in the given directory (optionally with recursion).
#  * `list_memories`: List available memories. Any memory can be read using the `read_memory` tool.
#  * `onboarding`: Performs onboarding (identifying the project structure and essential tasks, e.g. for testing or building).
#  * `read_file`: Reads a file within the project directory.
#  * `read_memory`: Read the content of a memory file. This tool should only be used if the information
#       is relevant to the current task. You can infer whether the information
#       is relevant from the memory file name.
#       You should not read the same memory file multiple times in the same conversation.
#  * `rename_memory`: Renames or moves a memory. Moving between project and global scope is supported
#       (e.g., renaming "global/foo" to "bar" moves it from global to project scope).
#  * `rename_symbol`: Renames a symbol throughout the codebase using language server refactoring capabilities.
#       For JB, we use a separate tool.
#  * `replace_content`: Replaces content in a file (optionally using regular expressions).
#  * `replace_symbol_body`: Replaces the full definition of a symbol using the language server backend.
#  * `safe_delete_symbol`:
#  * `search_for_pattern`: Performs a search for a pattern in the project.
#  * `summarize_changes`: Provides instructions for summarizing the changes made to the codebase.
#  * `switch_modes`: Activates modes by providing a list of their names
#  * `think_about_collected_information`: Thinking tool for pondering the completeness of collected information.
#  * `think_about_task_adherence`: Thinking tool for determining whether the agent is still on track with the current task.
#  * `think_about_whether_you_are_done`: Thinking tool for determining whether the task is truly completed.
#  * `write_memory`: Writes a named memory (for future reference) to Serena's project-specific memory store.
excluded_tools:
- read_file          # Deja que use get_symbols_overview en su lugar
- list_dir           # Prioriza search_for_pattern o find_symbol
- execute_shell_command  # Deshabilita bash directo; usa onboarding para builds
# - create_text_file
# - delete_lines

# initial prompt for the project. It will always be given to the LLM upon activating the project
# (contrary to the memories, which are loaded on demand).
initial_prompt: |
  Eres un ingeniero de software senior experto en este código base.

  REGLAS DE ARRANQUE OBLIGATORIAS (ejecútalas siempre al inicio de cada nueva conversación):
  1. LO PRIMERO: ejecuta `activate_project` sin parámetros.
  2. Luego ejecuta `get_current_config` para confirmar proyecto activo.
  3. Si es necesario, ejecuta `onboarding`.
  4. Nunca respondas al usuario hasta completar 1-3.

  REGLAS INQUEBRANTABLES:
  • NUNCA uses herramientas nativas de Claude para leer, buscar o editar código.
  • Usa EXCLUSIVAMENTE herramientas de Serena MCP.
  • Edición solo con: insert_at_line, replace_lines, insert_after_symbol, replace_symbol_body.
  • Antes de editar: siempre explora con get_symbols_overview / find_referencing_symbols.

  Si intentas usar Update, Bash, sed, create_text_file o cualquier vía no-MCP → detente y reintenta con herramientas de Serena.

  ESTILO DE CÓDIGO OBLIGATORIO:
  • Usa un estilo idiomático y orientado a objetos.
  • Para cualquier interfaz no trivial, emplea abstracciones explícitamente tipadas en lugar de simples funciones (por ejemplo, aplica el patrón Strategy).
  • Evita en todo momento el uso de estructuras de datos de bajo nivel cuando sea más apropiado una abstracción orientada a objetos.
  • Para almacenamiento simple de datos, utiliza dataclasses en lugar de diccionarios o tuplas.

  • Estructura las implementaciones de funciones en bloques funcionales separados por líneas en blanco.
  • Al inicio de cada bloque funcional, escribe una frase elíptica (empezando en minúscula) que describa de forma concisa el propósito del bloque.

  • Docstrings: utiliza siempre reStructuredText de forma consistente.

  • Comentarios y descripciones:
    - Cuando describas parámetros, métodos, funciones o clases, emplea un estilo preciso.
    - La frase inicial (elíptica) debe definir claramente *qué* es.
    - Los detalles adicionales van en oraciones posteriores.



included_optional_tools:
- think_about_task_adherence  # Fuerza chequeos como "¿Estoy usando Serena?"
- get_current_config
- initial_instructions
- replace_symbol_body
- insert_at_line
- insert_after_symbol
- insert_before_symbol
- replace_lines
- create_text_file
- delete_lines
- list_dir
- read_file
- replace_content
- switch_modes

